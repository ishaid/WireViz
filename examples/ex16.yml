connectors:
  X1:
    type: Molex KK 254 # more information
    subtype: female
    pinlabels: [GND, VCC, CAN_H, CAN_L] # pincount is implicit in pinout
  X2:
    type: Molex KK 254
    subtype: female
    pinlabels: [GND, VCC, CAN_H, CAN_L]

cables:
  W1:
    category: multi-lead
    colors: [BK, RD, YE, OL]
    casing_color: GY
    wirecount: 4 # need to specify number of wires explicitly when using a color code
    gauge: [10, 10, 28, 22] AWG # also accepts AWG as unit
    show_equiv: true # auto-calculate AWG equivalent from metric gauge
    length: 0.2 # length in m
    type: CAN

connections:
  -
    - X1: [1-4]
    - W1: [1-4]
    - X2: [1-4] # crossover
