# Example 15: Multi-lead Ethernet cable
connectors:
  X1:
    type: RJ45
    subtype: male
    pinlabels: [DB+,DB-,DA+,DD+,DD-,DA-,DC+,DC-]

  X2:
    type: RJ45
    subtype: male
    pinlabels: [DB+,DB-,DA+,DD+,DD-,DA-,DC+,DC-]

cables:
  W1:
    category: multi-lead
    color_code: T568A
    casing_color: GY
    show_name: false
    show_wirenumbers: false
    wirecount: 8 
    gauge: 24 AWG
    length: 1 
    shield: false
    type: CAT5e
    image:
      src: resources/cat6-section.png
      width: 80

connections:
  - - X1: [1-8]
    - W1: [1-8]
    - X2: [1-8]
